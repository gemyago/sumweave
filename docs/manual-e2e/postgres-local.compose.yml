services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: signal_foundry_local
      POSTGRES_USER: signal_foundry_owner
      POSTGRES_PASSWORD: signal_foundry_owner_local
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signal_foundry_owner -d signal_foundry_local"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - signal_foundry_pg_verify_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro

volumes:
  signal_foundry_pg_verify_data:
