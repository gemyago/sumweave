services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sumweave_local
      POSTGRES_USER: sumweave_owner
      POSTGRES_PASSWORD: sumweave_owner_local
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sumweave_owner -d sumweave_local"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - sumweave_pg_verify_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro

volumes:
  sumweave_pg_verify_data:
