    requests: {cpu: 50m, memory: 128Mi}
httpRoute:
  enabled: true
  gatewayName: public
  namespace: gateway-system
  sectionName: https
  hostnames: [signal-foundry.example.com]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
