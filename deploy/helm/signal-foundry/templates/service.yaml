apiVersion: v1
kind: Service
metadata:
  name: {{ include "signal-foundry.fullname" . }}
  labels: {{- include "signal-foundry.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports: [{name: http, port: {{ .Values.service.port }}, targetPort: http, protocol: TCP}]
  selector: {{- include "signal-foundry.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: app
