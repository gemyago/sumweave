{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "signal-foundry.fullname" . }}-{{ .Values.httpRoute.nameSuffix }}
  labels: {{- include "signal-foundry.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ required "httpRoute.gatewayName is required" .Values.httpRoute.gatewayName }}
      namespace: {{ required "httpRoute.namespace is required" .Values.httpRoute.namespace }}
      {{- with .Values.httpRoute.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  hostnames: {{- toYaml .Values.httpRoute.hostnames | nindent 4 }}
  rules:
    {{- range .Values.httpRoute.rules }}
    - {{- toYaml . | nindent 6 }}
      backendRefs:
        - name: {{ include "signal-foundry.fullname" $ }}
          port: {{ $.Values.service.port }}
    {{- end }}
{{- end }}
