name: Build

on: 
  pull_request:
    types: [opened, synchronize, reopened]

    # This is target branch filter, not current branch
    branches:
      - 'main'

# Allow just a single build to run at a time for a given ref
concurrency:
  group: build-flow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-tests:
    name: Tests
    uses: ./.github/workflows/tests-run.yml
  release-and-chart:
    name: Release artifacts and Helm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm ci --prefix apps/sumweave-ui
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: go.work.sum
      - run: make -C build test dist
      - run: make -C deploy lint render-production test
