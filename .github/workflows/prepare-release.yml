# Copied from gemyago/golang-backend-boilerplate@798f0dc9fd753481d0d698d8232ea08df44185b6.
name: Prepare Release

"on":
  workflow_dispatch:
    inputs:
      release_name:
        description: Draft release tag, for example v1.2.3
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare-draft-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - run: gh release create "$RELEASE_NAME" --draft --title "$RELEASE_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NAME: ${{ inputs.release_name }}
