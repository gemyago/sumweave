# Adapted from gemyago/golang-backend-boilerplate@798f0dc9fd753481d0d698d8232ea08df44185b6.
name: Tag Release Image

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: {ref: ${{ github.event.release.tag_name }}}
      - name: Install Crane
        run: make -C build install-crane
      - name: Login Crane to GHCR
        run: echo "$GITHUB_TOKEN" | build/bin/crane auth login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env: {GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}}
      - name: Retag immutable commit image
        run: |
          tags="$(build/scripts/resolve-docker-tags.sh --stable-branches main --git-ref "refs/tags/${RELEASE_TAG}" --commit-sha "$GITHUB_SHA")"
          bash build/scripts/tag-remote-images.sh --source-commit-sha "$GITHUB_SHA" --target-tags "$tags" --image ghcr.io/gemyago/signal-foundry
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
