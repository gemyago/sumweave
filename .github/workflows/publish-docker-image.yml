# Adapted from gemyago/golang-backend-boilerplate@798f0dc9fd753481d0d698d8232ea08df44185b6.
name: Publish Docker Image

"on":
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or SHA to publish (maintainer-trusted source)
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  publish:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm ci --prefix apps/sumweave-ui
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: go.work.sum
      - name: Build prepared host artifacts
        run: make -C build dist
      - name: Record checked-out source metadata
        run: |
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_REF=${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || 'main' }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Package and publish prepared artifacts
        run: make -C build docker/remote-image
        env:
          GIT_COMMIT_SHA: ${{ env.SOURCE_SHA }}
          GIT_REF: ${{ env.SOURCE_REF }}
      - name: Advance published image head
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          tag_ref=refs/tags/docker-image-head
          current=$(git ls-remote --refs origin "$tag_ref")
          current=${current%%$'\t'*}
          if [[ -n "$current" ]]; then
            git fetch --no-tags origin "$current"
            if ! git merge-base --is-ancestor "$current^{commit}" "$SOURCE_SHA"; then
              echo "Published source does not advance docker-image-head; leaving it unchanged."
              exit 0
            fi
            if [[ "$(git rev-parse "$current^{commit}")" == "$SOURCE_SHA" ]]; then
              echo "docker-image-head already points to the published source."
              exit 0
            fi
          fi
          # Compare-and-swap also protects initial creation (an empty expected ref).
          # A concurrent update rejects this push rather than overwriting its tag.
          git push --force-with-lease="$tag_ref:$current" origin "$SOURCE_SHA:$tag_ref"
