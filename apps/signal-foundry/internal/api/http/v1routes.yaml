openapi: 3.0.3
info:
  title: Signal Foundry API
  description: |
    HTTP API for Signal Foundry application.
  version: 1.0.0

servers:
  - url: http://localhost:8080

paths:
  /health:
    get:
      summary: Health check endpoint
      operationId: healthCheck
      tags:
        - health
      responses:
        '200':
            description: Request succeeded
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/HealthResponsePayload"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/login:
    post:
      summary: Log in with username and password
      operationId: authLogin
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginRequest"
      responses:
        '200':
          description: Tokens and user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/refresh:
    post:
      summary: Refresh access token using refresh token
      operationId: authRefresh
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRefreshRequest"
      responses:
        '200':
          description: New tokens and user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/me:
    get:
      summary: Current authenticated user
      operationId: authMe
      tags:
        - auth
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfo"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/data/candles:
    get:
      summary: Browse persisted normalized candles
      operationId: listDataCandles
      tags:
        - data
      parameters:
        - in: query
          name: venue
          required: true
          schema:
            type: string
        - in: query
          name: symbol
          required: true
          schema:
            type: string
        - in: query
          name: assetClass
          required: true
          schema:
            type: string
        - in: query
          name: timeframe
          required: true
          schema:
            type: string
        - in: query
          name: start
          required: true
          schema:
            type: string
            format: date-time
        - in: query
          name: end
          required: true
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Persisted candle rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataCandleListResponse"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/data/candle-availability:
    get:
      summary: Browse persisted normalized candle availability
      operationId: listDataCandleAvailability
      tags:
        - data
      parameters:
        - in: query
          name: venue
          schema:
            type: string
        - in: query
          name: symbol
          schema:
            type: string
        - in: query
          name: assetClass
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            format: int64
            default: 50
            minimum: 1
            maximum: 200
        - in: query
          name: cursor
          schema:
            type: string
      responses:
        '200':
          description: Persisted candle availability page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandleAvailabilityListResponse"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/data/raw-payloads:
    get:
      summary: Browse raw payload metadata
      operationId: listDataRawPayloads
      tags:
        - data
      parameters:
        - in: query
          name: venue
          required: true
          schema:
            type: string
        - in: query
          name: symbol
          schema:
            type: string
        - in: query
          name: assetClass
          schema:
            type: string
        - in: query
          name: timeframe
          schema:
            type: string
        - in: query
          name: start
          schema:
            type: string
            format: date-time
        - in: query
          name: end
          schema:
            type: string
            format: date-time
        - in: query
          name: ingestionRunId
          schema:
            type: string
        - in: query
          name: entityHint
          schema:
            type: string
        - in: query
          name: endpoint
          schema:
            type: string
        - in: query
          name: requestType
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            format: int64
        - in: query
          name: cursor
          schema:
            type: string
      responses:
        '200':
          description: Raw payload metadata page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RawPayloadMetadataListResponse"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/data/raw-payloads/{id}:
    get:
      summary: Read raw payload detail preview
      operationId: getDataRawPayload
      tags:
        - data
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Raw payload detail preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RawPayloadDetailResponse"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/data/candle-raw-payloads:
    get:
      summary: Browse raw payload metadata linked to one candle
      operationId: listDataCandleRawPayloads
      tags:
        - data
      parameters:
        - in: query
          name: venue
          required: true
          schema:
            type: string
        - in: query
          name: symbol
          required: true
          schema:
            type: string
        - in: query
          name: assetClass
          required: true
          schema:
            type: string
        - in: query
          name: timeframe
          required: true
          schema:
            type: string
        - in: query
          name: start
          required: true
          schema:
            type: string
            format: date-time
        - in: query
          name: end
          required: true
          schema:
            type: string
            format: date-time
        - in: query
          name: provenanceSource
          required: true
          schema:
            type: string
        - in: query
          name: provenanceIdentity
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Candle-linked raw payload metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandleRawPayloadMetadataListResponse"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/strategies:
    get:
      summary: List saved strategy versions
      operationId: listStrategies
      tags:
        - strategies
      responses:
        '200':
          description: Saved strategy versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyVersionListResponse"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/strategies/validate:
    post:
      summary: Validate a strategy definition without saving it
      operationId: validateStrategy
      tags:
        - strategies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrategyValidationRequest"
      responses:
        '200':
          description: Validation preview or deterministic errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyValidationResponse"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/strategies/versions:
    post:
      summary: Create a saved immutable strategy version
      operationId: createStrategyVersion
      tags:
        - strategies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStrategyVersionRequest"
      responses:
        '200':
          description: Saved immutable strategy version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyVersionDetail"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/strategies/{strategyId}/versions/{version}:
    get:
      summary: Get one saved strategy version
      operationId: getStrategyVersion
      tags:
        - strategies
      parameters:
        - in: path
          name: strategyId
          required: true
          schema:
            type: string
        - in: path
          name: version
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Saved immutable strategy version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyVersionDetail"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/strategies/{strategyId}/versions/{version}/duplicate:
    post:
      summary: Duplicate one saved strategy version as a draftable candidate
      operationId: duplicateStrategyVersion
      tags:
        - strategies
      parameters:
        - in: path
          name: strategyId
          required: true
          schema:
            type: string
        - in: path
          name: version
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Draftable duplicate candidate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyVersionCandidate"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/jobs:
    get:
      summary: List durable historical ingestion jobs
      operationId: listJobs
      tags:
        - jobs
      parameters:
        - in: query
          name: status
          schema:
            type: array
            items:
              type: string
        - in: query
          name: jobType
          schema:
            type: array
            items:
              type: string
        - in: query
          name: source
          schema:
            type: array
            items:
              type: string
        - in: query
          name: limit
          schema:
            type: integer
            format: int64
            default: 25
            minimum: 1
            maximum: 100
        - in: query
          name: cursor
          schema:
            type: string
      responses:
        '200':
          description: Durable jobs page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobListResponse"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/jobs/{jobId}:
    get:
      summary: Get one durable historical ingestion job
      operationId: getJob
      tags:
        - jobs
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Durable historical ingestion job detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDetailResponse"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/jobs/historical-data-backfills:
    post:
      summary: Create one queued historical data backfill job
      operationId: createHistoricalDataBackfillJob
      tags:
        - jobs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHistoricalDataBackfillJobRequest"
      responses:
        '200':
          description: Queued historical data backfill job detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDetailResponse"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/evaluations/backtests:
    get:
      summary: List persisted evaluation backtest runs
      operationId: listEvaluationBacktests
      tags:
        - evaluations
      parameters:
        - in: query
          name: strategyId
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
      responses:
        '200':
          description: Persisted evaluation backtest runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationListResponse"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create and synchronously run one evaluation backtest
      operationId: createEvaluationBacktest
      tags:
        - evaluations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEvaluationRequest"
      responses:
        '200':
          description: Completed or failed persisted evaluation backtest detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationDetail"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/evaluations/backtests/{runId}:
    get:
      summary: Get one persisted evaluation backtest detail
      operationId: getEvaluationBacktest
      tags:
        - evaluations
      parameters:
        - in: path
          name: runId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Persisted evaluation backtest detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationDetail"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/evaluations/backtests/{runId}/report:
    get:
      summary: Get compact persisted evaluation report view
      operationId: getEvaluationBacktestReport
      tags:
        - evaluations
      parameters:
        - in: path
          name: runId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Compact persisted evaluation report view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationReport"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/evaluations/backtests/{runId}/evidence:
    get:
      summary: Get bounded persisted evaluation evidence
      operationId: getEvaluationBacktestEvidence
      tags:
        - evaluations
      parameters:
        - in: path
          name: runId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Bounded persisted evaluation evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationEvidence"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    HealthResponsePayload:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - OK
    AuthLoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
    AuthRefreshRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
    UserInfo:
      type: object
      required:
        - id
        - username
      properties:
        id:
          type: string
        username:
          type: string
    AuthSessionResponse:
      type: object
      required:
        - accessToken
        - refreshToken
        - user
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: "#/components/schemas/UserInfo"
    DataCandle:
      type: object
      required:
        - identity
        - venue
        - symbol
        - assetClass
        - timeframe
        - start
        - end
        - open
        - high
        - low
        - close
        - volume
        - quality
        - provenanceSource
        - provenanceIdentity
      properties:
        identity:
          type: integer
          format: int64
        venue:
          type: string
        symbol:
          type: string
        assetClass:
          type: string
        timeframe:
          type: string
        start:
          type: string
          format: date-time
          nullable: true
        end:
          type: string
          format: date-time
          nullable: true
        open:
          type: number
          format: double
        high:
          type: number
          format: double
        low:
          type: number
          format: double
        close:
          type: number
          format: double
        volume:
          type: number
          format: double
        quality:
          type: string
        provenanceSource:
          type: string
        provenanceIdentity:
          type: string
    DataCandleListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DataCandle"
    CandleAvailabilityTimeframeSummary:
      type: object
      required:
        - timeframe
        - start
        - end
        - count
      properties:
        timeframe:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        count:
          type: integer
          format: int64
    CandleAvailabilityDefaultSlice:
      type: object
      required:
        - timeframe
        - start
        - end
      properties:
        timeframe:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
    CandleAvailabilityItem:
      type: object
      required:
        - venue
        - symbol
        - assetClass
        - timeframes
        - defaultSlice
      properties:
        venue:
          type: string
        symbol:
          type: string
        assetClass:
          type: string
        timeframes:
          type: array
          items:
            $ref: "#/components/schemas/CandleAvailabilityTimeframeSummary"
        defaultSlice:
          $ref: "#/components/schemas/CandleAvailabilityDefaultSlice"
    CandleAvailabilityDefaultSelection:
      type: object
      required:
        - venue
        - symbol
        - assetClass
        - timeframe
        - start
        - end
      properties:
        venue:
          type: string
        symbol:
          type: string
        assetClass:
          type: string
        timeframe:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
    CandleAvailabilityListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CandleAvailabilityItem"
        nextCursor:
          type: string
        defaultSelection:
          $ref: "#/components/schemas/CandleAvailabilityDefaultSelection"
    RawPayloadMetadata:
      type: object
      required:
        - id
        - ingestionRunId
        - source
        - venue
        - endpoint
        - requestType
        - requestPayloadHash
        - requestAt
        - responseAt
        - httpStatus
        - responseBodyHash
        - payloadBodyRef
        - entityHint
        - receivedAt
      properties:
        id:
          type: string
        ingestionRunId:
          type: string
        source:
          type: string
        venue:
          type: string
        endpoint:
          type: string
        requestType:
          type: string
        requestPayloadHash:
          type: string
        requestAt:
          type: string
          format: date-time
        responseAt:
          type: string
          format: date-time
        httpStatus:
          type: integer
          format: int64
        responseBodyHash:
          type: string
        payloadBodyRef:
          type: string
        entityHint:
          type: string
        symbol:
          type: string
        assetClass:
          type: string
        timeframe:
          type: string
        start:
          type: string
          format: date-time
          nullable: true
        end:
          type: string
          format: date-time
          nullable: true
        receivedAt:
          type: string
          format: date-time
    RawPayloadMetadataListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RawPayloadMetadata"
        nextCursor:
          type: string
    RawPayloadDetailResponse:
      type: object
      required:
        - metadata
        - responseBodySizeBytes
        - responseBodyPreview
        - responseBodyPreviewTruncated
      properties:
        metadata:
          $ref: "#/components/schemas/RawPayloadMetadata"
        responseBodySizeBytes:
          type: integer
          format: int64
        responseBodyPreview:
          type: string
        responseBodyPreviewTruncated:
          type: boolean
    CandleRawPayloadMetadataListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RawPayloadMetadata"
    StrategyDefinitionInstrument:
      type: object
      required:
        - venue
        - symbol
        - assetClass
        - active
      properties:
        venue:
          type: string
        symbol:
          type: string
        assetClass:
          type: string
        active:
          type: boolean
    StrategyDefinitionParameters:
      type: object
      required:
        - fastWindow
        - slowWindow
      properties:
        fastWindow:
          type: integer
          format: int64
        slowWindow:
          type: integer
          format: int64
    StrategyDefinition:
      type: object
      required:
        - kind
        - instrument
        - timeframe
        - parameters
      properties:
        kind:
          type: string
        instrument:
          $ref: "#/components/schemas/StrategyDefinitionInstrument"
        timeframe:
          type: string
        parameters:
          $ref: "#/components/schemas/StrategyDefinitionParameters"
    StrategyParameterSummary:
      type: object
      required:
        - fastWindow
        - slowWindow
      properties:
        fastWindow:
          type: integer
          format: int64
        slowWindow:
          type: integer
          format: int64
    StrategyFieldError:
      type: object
      required:
        - path
        - message
      properties:
        path:
          type: string
        message:
          type: string
    StrategyValidationPreview:
      type: object
      required:
        - schemaVersion
        - kind
        - instrument
        - timeframe
        - parameterSummary
        - canonicalJson
        - artifactHash
        - existingArtifact
      properties:
        schemaVersion:
          type: string
        kind:
          type: string
        instrument:
          $ref: "#/components/schemas/StrategyDefinitionInstrument"
        timeframe:
          type: string
        parameterSummary:
          $ref: "#/components/schemas/StrategyParameterSummary"
        canonicalJson:
          type: string
        artifactHash:
          type: string
        existingArtifact:
          type: boolean
    StrategyValidationRequest:
      type: object
      required:
        - definition
      properties:
        definition:
          $ref: "#/components/schemas/StrategyDefinition"
    StrategyValidationResponse:
      type: object
      required:
        - valid
        - errors
      properties:
        valid:
          type: boolean
        preview:
          $ref: "#/components/schemas/StrategyValidationPreview"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/StrategyFieldError"
    CreateStrategyVersionRequest:
      type: object
      required:
        - strategyId
        - version
        - displayName
        - definition
      properties:
        strategyId:
          type: string
        version:
          type: string
        displayName:
          type: string
        notes:
          type: string
        parentStrategyId:
          type: string
        parentVersion:
          type: string
        definition:
          $ref: "#/components/schemas/StrategyDefinition"
    StrategyVersionRow:
      type: object
      required:
        - strategyId
        - version
        - displayName
        - status
        - sourceType
        - sourceLabel
        - artifactHash
        - schemaVersion
        - kind
        - instrument
        - timeframe
        - parameterSummary
        - notes
        - createdAt
        - updatedAt
      properties:
        strategyId:
          type: string
        version:
          type: string
        displayName:
          type: string
        status:
          type: string
        sourceType:
          type: string
        sourceLabel:
          type: string
        artifactHash:
          type: string
        schemaVersion:
          type: string
        kind:
          type: string
        instrument:
