openapi: 3.0.3
info:
  title: Signal Foundry API
  description: |
    HTTP API for Signal Foundry application.
  version: 1.0.0

servers:
  - url: http://localhost:8080

paths:
  /health:
    get:
      summary: Health check endpoint
      operationId: healthCheck
      tags:
        - health
      responses:
        '200':
            description: Request succeeded
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/HealthResponsePayload"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/login:
    post:
      summary: Log in with username and password
      operationId: authLogin
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginRequest"
      responses:
        '200':
          description: Tokens and user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/refresh:
    post:
      summary: Refresh access token using refresh token
      operationId: authRefresh
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRefreshRequest"
      responses:
        '200':
          description: New tokens and user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/me:
    get:
      summary: Current authenticated user
      operationId: authMe
      tags:
        - auth
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfo"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/data/candles:
    get:
      summary: Browse persisted normalized candles
      operationId: listDataCandles
      tags:
        - data
      parameters:
        - in: query
          name: venue
          required: true
          schema:
            type: string
        - in: query
          name: symbol
          required: true
          schema:
            type: string
        - in: query
          name: assetClass
          required: true
          schema:
            type: string
        - in: query
          name: timeframe
          required: true
          schema:
            type: string
        - in: query
          name: start
          required: true
          schema:
            type: string
            format: date-time
        - in: query
          name: end
          required: true
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Persisted candle rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataCandleListResponse"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/data/candle-availability:
    get:
      summary: Browse persisted normalized candle availability
      operationId: listDataCandleAvailability
      tags:
        - data
      parameters:
        - in: query
          name: venue
          schema:
            type: string
        - in: query
          name: symbol
          schema:
            type: string
        - in: query
          name: assetClass
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            format: int64
            default: 50
            minimum: 1
            maximum: 200
        - in: query
          name: cursor
          schema:
            type: string
      responses:
        '200':
          description: Persisted candle availability page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandleAvailabilityListResponse"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/data/raw-payloads:
    get:
      summary: Browse raw payload metadata
      operationId: listDataRawPayloads
      tags:
        - data
      parameters:
        - in: query
          name: venue
          required: true
          schema:
            type: string
        - in: query
          name: symbol
          schema:
            type: string
        - in: query
          name: assetClass
          schema:
            type: string
        - in: query
          name: timeframe
          schema:
            type: string
        - in: query
          name: start
          schema:
            type: string
        - in: query
          name: end
          schema:
            type: string
        - in: query
          name: ingestionRunId
          schema:
            type: string
        - in: query
          name: entityHint
          schema:
            type: string
        - in: query
          name: endpoint
          schema:
            type: string
        - in: query
          name: requestType
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            format: int64
        - in: query
          name: cursor
          schema:
            type: string
      responses:
        '200':
          description: Raw payload metadata page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RawPayloadMetadataListResponse"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/data/raw-payloads/{id}:
    get:
      summary: Read raw payload detail preview
      operationId: getDataRawPayload
      tags:
        - data
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Raw payload detail preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RawPayloadDetailResponse"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/data/candle-raw-payloads:
    get:
      summary: Browse raw payload metadata linked to one candle
      operationId: listDataCandleRawPayloads
      tags:
        - data
      parameters:
        - in: query
          name: venue
          required: true
          schema:
            type: string
        - in: query
          name: symbol
          required: true
          schema:
            type: string
        - in: query
          name: assetClass
          required: true
          schema:
            type: string
        - in: query
          name: timeframe
          required: true
          schema:
            type: string
        - in: query
          name: start
          required: true
          schema:
            type: string
            format: date-time
        - in: query
          name: end
          required: true
          schema:
            type: string
            format: date-time
        - in: query
          name: provenanceSource
          required: true
          schema:
            type: string
        - in: query
          name: provenanceIdentity
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Candle-linked raw payload metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandleRawPayloadMetadataListResponse"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/strategies:
    get:
      summary: List saved strategy versions
      operationId: listStrategies
      tags:
        - strategies
      responses:
        '200':
          description: Saved strategy versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyVersionListResponse"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/strategies/validate:
    post:
      summary: Validate a strategy definition without saving it
      operationId: validateStrategy
      tags:
        - strategies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrategyValidationRequest"
      responses:
        '200':
          description: Validation preview or deterministic errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyValidationResponse"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/strategies/versions:
    post:
      summary: Create a saved immutable strategy version
      operationId: createStrategyVersion
      tags:
        - strategies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStrategyVersionRequest"
      responses:
        '200':
          description: Saved immutable strategy version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyVersionDetail"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/strategies/{strategyId}/versions/{version}:
    get:
      summary: Get one saved strategy version
      operationId: getStrategyVersion
      tags:
        - strategies
      parameters:
        - in: path
          name: strategyId
          required: true
          schema:
            type: string
        - in: path
          name: version
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Saved immutable strategy version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyVersionDetail"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/strategies/{strategyId}/versions/{version}/duplicate:
    post:
      summary: Duplicate one saved strategy version as a draftable candidate
      operationId: duplicateStrategyVersion
      tags:
        - strategies
      parameters:
        - in: path
          name: strategyId
          required: true
          schema:
            type: string
        - in: path
          name: version
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Draftable duplicate candidate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyVersionCandidate"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/jobs:
    get:
      summary: List durable registered jobs
      operationId: listJobs
      tags:
        - jobs
      parameters:
        - in: query
          name: status
          schema:
            type: array
            items:
              type: string
        - in: query
          name: jobType
          schema:
            type: array
            items:
              type: string
        - in: query
          name: source
          schema:
            type: array
            items:
              type: string
        - in: query
          name: limit
          schema:
            type: integer
            format: int64
            default: 25
            minimum: 1
            maximum: 100
        - in: query
          name: cursor
          schema:
            type: string
      responses:
        '200':
          description: Durable jobs page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobListResponse"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/jobs/{jobId}:
    get:
      summary: Get one durable registered job
      operationId: getJob
      tags:
        - jobs
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Durable registered job detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDetailResponse"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/jobs/historical-data-backfills:
    post:
      summary: Create one queued historical data backfill job
      operationId: createHistoricalDataBackfillJob
      tags:
        - jobs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHistoricalDataBackfillJobRequest"
      responses:
        '200':
          description: Queued historical data backfill job detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDetailResponse"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/evaluations/backtests:
    get:
      summary: List persisted evaluation backtest runs
      operationId: listEvaluationBacktests
      tags:
        - evaluations
      parameters:
        - in: query
          name: strategyId
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
      responses:
        '200':
          description: Persisted evaluation backtest runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationListResponse"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create and synchronously run one evaluation backtest
      operationId: createEvaluationBacktest
      tags:
        - evaluations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEvaluationRequest"
      responses:
        '200':
          description: Completed or failed persisted evaluation backtest detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationDetail"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/evaluations/backtests/{runId}:
    get:
      summary: Get one persisted evaluation backtest detail
      operationId: getEvaluationBacktest
      tags:
        - evaluations
      parameters:
        - in: path
          name: runId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Persisted evaluation backtest detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationDetail"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/evaluations/backtests/{runId}/report:
    get:
      summary: Get compact persisted evaluation report view
      operationId: getEvaluationBacktestReport
      tags:
        - evaluations
      parameters:
        - in: path
          name: runId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Compact persisted evaluation report view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationReport"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/evaluations/backtests/{runId}/evidence:
    get:
      summary: Get bounded persisted evaluation evidence
      operationId: getEvaluationBacktestEvidence
      tags:
        - evaluations
      parameters:
        - in: path
          name: runId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Bounded persisted evaluation evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationEvidence"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/finance/tenants:
    get:
      summary: List finance tenants
      operationId: listFinanceTenants
      tags: [finance]
      responses:
        '200':
          description: Finance tenants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceTenantListResponse"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create finance tenant
      operationId: createFinanceTenant
      tags: [finance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceTenantCreateRequest"
      responses:
        '200':
          description: Created finance tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceTenantSummary"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/finance/tenants/{tenantId}:
    get:
      summary: Select finance tenant
      operationId: getFinanceTenant
      tags: [finance]
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Selected finance tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceTenantSummary"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      summary: Update finance tenant
      operationId: updateFinanceTenant
      tags: [finance]
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceTenantUpdateRequest"
      responses:
        '204':
          description: Updated finance tenant
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/finance/tenants/{tenantId}/archive:
    post:
      summary: Archive finance tenant
      operationId: archiveFinanceTenant
      tags: [finance]
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Archived finance tenant
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/finance/tenants/{tenantId}/members:
    get:
      summary: List finance tenant members
      operationId: listFinanceTenantMembers
      tags: [finance]
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Finance tenant members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceTenantMembersResponse"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/finance/tenants/{tenantId}/invites:
    get:
      summary: List finance tenant invites
      operationId: listFinanceTenantInvites
      tags: [finance]
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Finance tenant invites
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceTenantInvitesResponse"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create finance tenant invite
      operationId: createFinanceTenantInvite
      tags: [finance]
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceTenantInviteCreateRequest"
      responses:
        '200':
          description: Created finance tenant invite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceTenantInvite"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/finance/invites/accept:
    post:
      summary: Accept finance tenant invite
      operationId: acceptFinanceTenantInvite
      tags: [finance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceAcceptInviteRequest"
      responses:
        '200':
          description: Accepted finance tenant membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceTenantMember"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/finance/tenants/{tenantId}/accounts:
    get:
      summary: List finance accounts
      operationId: listFinanceAccounts
      tags: [finance]
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
        - in: query
          name: includeHidden
          schema: { type: boolean }
      responses:
        '200':
          description: Finance accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceAccountsResponse"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create finance account
      operationId: createFinanceAccount
      tags: [finance]
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceAccountCreateRequest"
      responses:
        '200':
          description: Created finance account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceAccount"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/finance/tenants/{tenantId}/accounts/{accountId}:
    get:
      summary: Get finance account detail
      operationId: getFinanceAccount
      tags: [finance]
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
        - in: path
          name: accountId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Finance account detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceAccount"
        default:
          description: unexpected error
          content:
            application/json:
                schema:
                  $ref: "#/components/schemas/Error"
    patch:
      summary: Rename finance account
      operationId: updateFinanceAccount
      tags: [finance]
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
        - in: path
          name: accountId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceRenameRequest"
      responses:
        '204':
          description: Renamed finance account
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/finance/tenants/{tenantId}/accounts/{accountId}/evidence:
    get:
      summary: List current finance account provider evidence metadata
      operationId: listFinanceAccountProviderEvidence
      tags: [finance]
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
        - in: path
          name: accountId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Current provider evidence metadata for a finance account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceProviderEvidenceListResponse"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/finance/tenants/{tenantId}/accounts/{accountId}/hide:
    post:
      summary: Hide finance account
      operationId: hideFinanceAccount
      tags: [finance]
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
        - in: path
          name: accountId
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Hidden finance account
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/finance/tenants/{tenantId}/accounts/{accountId}/unhide:
    post:
      summary: Restore finance account
      operationId: unhideFinanceAccount
      tags: [finance]
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
        - in: path
          name: accountId
          required: true
          schema: { type: string }
      responses:
        '204':
