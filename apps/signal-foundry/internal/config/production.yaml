defaultLogLevel: INFO

# Ephemeral workspace-only storage; production durable state is database-backed.
dataDir: /tmp/signal-foundry

workspacefs:
  platformAgentsPath: /app/.platform-agents

skills:
  paths:
    - /app/.platform-agents/skills

auth:
  # Inject APP_AUTH_JWTSIGNINGKEY from a production secret.
  jwtSigningKey: ""

agentRuntime:
  storage:
    type: database
  database:
    # Inject APP_AGENTRUNTIME_DATABASE_DSN.
    dsn: ""

application:
  database:
    # Inject APP_APPLICATION_DATABASE_DSN.
    dsn: ""

pprofListener:
  # Make sure your app is fully internal if enabling it in production
  enabled: false
