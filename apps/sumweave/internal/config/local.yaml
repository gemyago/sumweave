# Create a local-user.yaml file to override settings for your local environment

defaultLogLevel: DEBUG

# Local paths are relative to the apps/sumweave working directory.
dataDir: data

application:
  database:
    dsn: postgres://sumweave_runtime:sumweave_runtime_local@127.0.0.1:55432/sumweave_local?sslmode=disable

agentRuntime:
  database:
    dsn: postgres://sumweave_runtime:sumweave_runtime_local@127.0.0.1:55432/sumweave_local?sslmode=disable

auth:
  jwtSigningKey: local-secret-key

finance:
  providers:
    enableBanking:
      # Local-only dummy app ID for startup validation; it cannot access a live provider.
      appID: local-dummy-enable-banking-app-id
      # Committed fake key fixture only; replace in local-user.yaml for live banking.
      privateKeyPath: data/test-enable-banking-private-key.pem

workspacefs:
  platformAgentsPath: ../../.platform-agents

skills:
  paths:
    - ../../.platform-agents/skills
