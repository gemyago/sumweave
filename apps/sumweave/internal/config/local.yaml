# Create a local-user.yaml file to override settings for your local environment

defaultLogLevel: DEBUG

# Local paths are relative to the apps/sumweave working directory.
dataDir: data

application:
  database:
    dsn: data/application.db

agentRuntime:
  database:
    dsn: data/agent-runtime.db

auth:
  jwtSigningKey: local-secret-key

finance:
  providers:
    enableBanking:
      # Dummy app ID and private key for local development.
      # Create local-user.yaml to override
      appID: "local-dummy-app-id"
      privateKeyPath: "internal/config/local-dummy-private-key.pem"

workspacefs:
  platformAgentsPath: ../../.platform-agents

skills:
  paths:
    - ../../.platform-agents/skills
