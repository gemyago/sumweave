openapi: 3.0.3
info:
  title: Sumweave API
  description: |
    HTTP API for Sumweave application.
  version: 1.0.0

servers:
  - url: http://localhost:8080

paths:
  /health:
    get:
      summary: Health check endpoint
      operationId: healthCheck
      tags:
        - health
      responses:
        '200':
            description: Request succeeded
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/HealthResponsePayload"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/login:
    post:
      summary: Log in with username and password
      operationId: authLogin
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginRequest"
      responses:
        '200':
          description: Tokens and user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/refresh:
    post:
      summary: Refresh access token using refresh token
      operationId: authRefresh
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRefreshRequest"
      responses:
        '200':
          description: New tokens and user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/me:
    get:
      summary: Current authenticated user
      operationId: authMe
      tags:
        - auth
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfo"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/jobs:
    get:
      summary: List durable registered jobs
      operationId: listJobs
      tags:
        - jobs
      parameters:
        - in: query
          name: status
          schema:
            type: array
            items:
              type: string
        - in: query
          name: jobType
          schema:
            type: array
            items:
              type: string
        - in: query
          name: source
          schema:
            type: array
            items:
              type: string
        - in: query
          name: limit
          schema:
            type: integer
            format: int64
            default: 25
            minimum: 1
            maximum: 100
        - in: query
          name: cursor
          schema:
            type: string
      responses:
        '200':
          description: Durable jobs page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobListResponse"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/jobs/{jobId}:
    get:
      summary: Get one durable registered job
      operationId: getJob
      tags:
        - jobs
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Durable registered job detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDetailResponse"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/finance/tenants:
    get:
      summary: List finance tenants
      operationId: listFinanceTenants
      tags: [finance]
      responses:
        '200':
          description: Finance tenants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceTenantListResponse"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create finance tenant
      operationId: createFinanceTenant
      tags: [finance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceTenantCreateRequest"
      responses:
        '200':
          description: Created finance tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceTenantSummary"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/finance/tenants/{tenantId}:
    get:
      summary: Select finance tenant
      operationId: getFinanceTenant
      tags: [finance]
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Selected finance tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceTenantSummary"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      summary: Update finance tenant
      operationId: updateFinanceTenant
      tags: [finance]
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceTenantUpdateRequest"
      responses:
        '204':
          description: Updated finance tenant
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/finance/tenants/{tenantId}/archive:
    post:
      summary: Archive finance tenant
      operationId: archiveFinanceTenant
      tags: [finance]
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Archived finance tenant
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/finance/tenants/{tenantId}/members:
    get:
      summary: List finance tenant members
      operationId: listFinanceTenantMembers
      tags: [finance]
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Finance tenant members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceTenantMembersResponse"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/finance/tenants/{tenantId}/invites:
    get:
      summary: List finance tenant invites
      operationId: listFinanceTenantInvites
      tags: [finance]
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Finance tenant invites
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceTenantInvitesResponse"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create finance tenant invite
      operationId: createFinanceTenantInvite
      tags: [finance]
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceTenantInviteCreateRequest"
      responses:
        '200':
          description: Created finance tenant invite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceTenantInvite"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/finance/invites/accept:
    post:
      summary: Accept finance tenant invite
      operationId: acceptFinanceTenantInvite
      tags: [finance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceAcceptInviteRequest"
      responses:
        '200':
          description: Accepted finance tenant membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceTenantMember"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/finance/tenants/{tenantId}/accounts:
    get:
      summary: List finance accounts
      operationId: listFinanceAccounts
      tags: [finance]
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
        - in: query
          name: includeHidden
          schema: { type: boolean }
      responses:
        '200':
          description: Finance accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceAccountsResponse"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create finance account
      operationId: createFinanceAccount
      tags: [finance]
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceAccountCreateRequest"
      responses:
        '200':
          description: Created finance account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceAccount"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/finance/tenants/{tenantId}/accounts/{accountId}:
    get:
      summary: Get finance account detail
      operationId: getFinanceAccount
      tags: [finance]
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
        - in: path
          name: accountId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Finance account detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceAccount"
        default:
          description: unexpected error
          content:
            application/json:
                schema:
                  $ref: "#/components/schemas/Error"
    patch:
      summary: Rename finance account
      operationId: updateFinanceAccount
      tags: [finance]
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
        - in: path
          name: accountId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceRenameRequest"
      responses:
        '204':
          description: Renamed finance account
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/finance/tenants/{tenantId}/accounts/{accountId}/provider-snapshots:
    get:
      summary: List current finance account provider snapshot metadata
      operationId: listFinanceAccountProviderSnapshots
      tags: [finance]
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
        - in: path
          name: accountId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Current provider snapshot metadata for a finance account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceProviderSnapshotListResponse"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/finance/tenants/{tenantId}/accounts/{accountId}/hide:
    post:
      summary: Hide finance account
      operationId: hideFinanceAccount
      tags: [finance]
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
        - in: path
          name: accountId
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Hidden finance account
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/finance/tenants/{tenantId}/accounts/{accountId}/unhide:
    post:
      summary: Restore finance account
      operationId: unhideFinanceAccount
      tags: [finance]
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
        - in: path
          name: accountId
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Restored finance account
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/finance/tenants/{tenantId}/accounts/{accountId}/provider-snapshots/{snapshotId}:
    get:
      summary: Get sanitized finance account provider snapshot
      operationId: getFinanceAccountProviderSnapshot
      tags: [finance]
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
        - in: path
          name: accountId
          required: true
          schema: { type: string }
        - in: path
          name: snapshotId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Sanitized provider snapshot for a finance account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceProviderSnapshot"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/finance/tenants/{tenantId}/categories:
    get:
      summary: List finance categories
      operationId: listFinanceCategories
      tags: [finance]
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
        - in: query
          name: includeHidden
          schema: { type: boolean }
      responses:
        '200':
          description: Finance categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceCategoriesResponse"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create finance category
      operationId: createFinanceCategory
      tags: [finance]
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceCategoryCreateRequest"
      responses:
        '200':
          description: Created finance category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceCategory"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/finance/tenants/{tenantId}/categories/{categoryId}:
    patch:
      summary: Update finance category
      operationId: updateFinanceCategory
      tags: [finance]
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
        - in: path
          name: categoryId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceCategoryUpdateRequest"
      responses:
        '204':
          description: Updated finance category
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/finance/tenants/{tenantId}/tags:
    get:
      summary: List finance tags
      operationId: listFinanceTags
      tags: [finance]
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
        - in: query
          name: includeHidden
          schema: { type: boolean }
      responses:
        '200':
          description: Finance tags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceTagsResponse"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create finance tag
      operationId: createFinanceTag
      tags: [finance]
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceTagCreateRequest"
      responses:
        '200':
          description: Created finance tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceTag"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/finance/tenants/{tenantId}/tags/{tagId}:
    patch:
      summary: Rename finance tag
      operationId: updateFinanceTag
      tags: [finance]
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
        - in: path
          name: tagId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceRenameRequest"
      responses:
        '204':
          description: Renamed finance tag
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/finance/tenants/{tenantId}/transactions:
    get:
      summary: List finance transactions
      operationId: listFinanceTransactions
      tags: [finance]
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
        - in: query
          name: accountId
          schema: { type: string }
        - in: query
          name: source
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: includeHidden
          schema: { type: boolean }
        - in: query
          name: limit
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - in: query
          name: offset
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        '200':
          description: Finance transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceTransactionsResponse"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create finance transaction
      operationId: createFinanceTransaction
      tags: [finance]
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceTransactionCreateRequest"
      responses:
        '200':
          description: Created finance transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceTransaction"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/finance/tenants/{tenantId}/transactions/{transactionId}:
    parameters:
      - in: path
        name: tenantId
        required: true
        schema: { type: string }
      - in: path
        name: transactionId
        required: true
        schema: { type: string }
    get:
      summary: Get finance transaction detail
      operationId: getFinanceTransaction
      tags: [finance]
      responses:
        '200':
          description: Finance transaction detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceTransaction"
        default:
          description: unexpected error
          content:
            application/json:
                schema:
                  $ref: "#/components/schemas/Error"
    patch:
      summary: Update finance transaction
      operationId: updateFinanceTransaction
      tags: [finance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceTransactionUpdateRequest"
      responses:
        '200':
          description: Updated finance transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceTransaction"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                  $ref: "#/components/schemas/Error"
  /api/v1/finance/tenants/{tenantId}/transactions/{transactionId}/transfer-candidates:
    get:
      summary: List visible in-range finance transfer candidates
      operationId: listFinanceTransferCandidates
      tags: [finance]
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
        - in: path
          name: transactionId
          required: true
          schema: { type: string }
        - in: query
          name: effectiveFrom
          required: true
          schema: { type: string, format: date-time }
        - in: query
          name: effectiveBefore
          required: true
          schema: { type: string, format: date-time }
        - in: query
          name: limit
          required: true
          schema: { type: integer, format: int64, minimum: 1, maximum: 200 }
        - in: query
          name: offset
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        '200':
          description: Visible finance transfer candidates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceTransactionsResponse"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/finance/tenants/{tenantId}/transactions/{transactionId}/transfer-partner:
    get:
      summary: Get the exact matched finance transfer partner
      operationId: getFinanceTransferPartner
      tags: [finance]
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
        - in: path
          name: transactionId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Matched finance transfer partner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceTransaction"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/finance/tenants/{tenantId}/transactions/transfer-links:
    post:
      summary: Link two booked finance transactions as one transfer
      operationId: linkFinanceTransferPair
      tags: [finance]
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceTransferPairRequest"
      responses:
        '204':
          description: Finance transfer pair linked
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Unlink one finance transfer pair and restore regular transactions
      operationId: unlinkFinanceTransferPair
      tags: [finance]
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceTransferPairRequest"
      responses:
        '204':
          description: Finance transfer pair unlinked
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/finance/tenants/{tenantId}/transactions/{transactionId}/provider-snapshots:
    get:
      summary: List current finance transaction provider snapshot metadata
      operationId: listFinanceTransactionProviderSnapshots
      tags: [finance]
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
        - in: path
          name: transactionId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Current provider snapshot metadata for a finance transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceProviderSnapshotListResponse"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/finance/tenants/{tenantId}/transactions/{transactionId}/provider-snapshots/{snapshotId}:
    get:
      summary: Get sanitized finance transaction provider snapshot
      operationId: getFinanceTransactionProviderSnapshot
