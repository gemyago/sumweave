components:
  schemas:
    HealthResponsePayload:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - OK
    AuthLoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
    AuthRefreshRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
    UserInfo:
      type: object
      required:
        - id
        - username
      properties:
        id:
          type: string
        username:
          type: string
    AuthSessionResponse:
      type: object
      required:
        - accessToken
        - refreshToken
        - user
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: "#/components/schemas/UserInfo"
    JobRequester:
      type: object
      required:
        - userId
        - source
      properties:
        userId:
          type: string
        source:
          type: string
    JobError:
      type: object
      required:
        - code
        - summary
        - details
      properties:
        code:
          type: string
        summary:
          type: string
        details:
          type: string
    JobSummary:
      type: object
      required:
        - id
        - jobType
        - status
        - requester
        - createdAt
        - updatedAt
        - attemptCount
      properties:
        id:
          type: string
        jobType:
          type: string
        status:
          type: string
        requester:
          $ref: "#/components/schemas/JobRequester"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        attemptCount:
          type: integer
          format: int64
        error:
          $ref: "#/components/schemas/JobError"
    JobDetailResponse:
      allOf:
        - $ref: "#/components/schemas/JobSummary"
        - type: object
          required:
            - workerId
          properties:
            workerId:
              type: string
            lastAttemptAt:
              type: string
              format: date-time
              nullable: true
    JobListResponse:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/JobSummary"
        nextCursor:
          type: string
    FinanceTenantCreateRequest:
      type: object
      required: [name, displayCurrency, seedDefaults]
      properties:
        name: { type: string }
        displayCurrency: { $ref: "#/components/schemas/FinanceTenantDisplayCurrency" }
        seedDefaults:
          type: boolean
          nullable: true
          description: Whether to add starter categories and tags to the tenant.
    FinanceTenantUpdateRequest:
      type: object
      required: [name, displayCurrency]
      properties:
        name: { type: string }
        displayCurrency: { $ref: "#/components/schemas/FinanceTenantDisplayCurrency" }
    FinanceTenantDisplayCurrency:
      type: string
      enum: [USD, EUR, PLN, UAH]
    FinanceTenantSummary:
      type: object
      required: [id, name, displayCurrency, joinedAt, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        displayCurrency: { type: string }
        archivedAt: { type: string, format: date-time, nullable: true }
        joinedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    FinanceTenantListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FinanceTenantSummary" }
    FinanceTenantMember:
      type: object
      required: [tenantId, userId, joinedAt]
      properties:
        tenantId: { type: string }
        userId: { type: string }
        username: { type: string, nullable: true }
        joinedAt: { type: string, format: date-time }
    FinanceTenantMembersResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FinanceTenantMember" }
    FinanceTenantInviteCreateRequest:
      type: object
      required: [recipient]
      properties:
        recipient: { type: string }
    FinanceTenantInvite:
      type: object
      required: [id, tenantId, code, recipient, createdByUserId, createdAt]
      properties:
        id: { type: string }
        tenantId: { type: string }
        code: { type: string }
        recipient: { type: string }
        createdByUserId: { type: string }
        acceptedByUserId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        acceptedAt: { type: string, format: date-time, nullable: true }
    FinanceTenantInvitesResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FinanceTenantInvite" }
    FinanceAcceptInviteRequest:
      type: object
      required: [code]
      properties:
        code: { type: string }
    FinanceAccountCreateRequest:
      type: object
      required: [name, currency, kind]
      properties:
        name: { type: string }
        currency: { type: string }
        kind: { type: string }
    FinanceRenameRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
    FinanceCategoryUpdateRequest:
      type: object
      required: [name, kind]
      properties:
        name: { type: string }
        kind: { type: string, enum: [expense, income] }
    FinanceAccount:
      type: object
      required: [id, tenantId, name, currency, kind, bookedBalanceMinor, pendingBalanceMinor, createdAt, updatedAt]
      properties:
        id: { type: string }
        tenantId: { type: string }
        name: { type: string }
        currency: { type: string }
        kind: { type: string }
        bookedBalanceMinor: { type: integer, format: int64 }
        pendingBalanceMinor: { type: integer, format: int64 }
        provider: { type: string }
        providerAccountId: { type: string }
        hiddenAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    FinanceAccountsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FinanceAccount" }
    FinanceProviderSnapshotMetadata:
      type: object
      required: [id, kind, providerObjectId, capturedAt]
      properties:
        id: { type: string }
        kind: { type: string, enum: [connection, account, account_balance, transaction] }
        providerObjectId: { type: string }
        capturedAt: { type: string, format: date-time }
    FinanceProviderSnapshotListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FinanceProviderSnapshotMetadata" }
    FinanceProviderSnapshot:
      allOf:
        - $ref: "#/components/schemas/FinanceProviderSnapshotMetadata"
        - type: object
          properties:
            data:
              type: object
              additionalProperties: true
    FinanceCategoryCreateRequest:
      type: object
      required: [name, kind]
      properties:
        name: { type: string }
        kind: { type: string }
    FinanceCategory:
      type: object
      required: [id, tenantId, name, kind, seededDefault, createdAt, updatedAt]
      properties:
        id: { type: string }
        tenantId: { type: string }
        name: { type: string }
        kind: { type: string }
        seededDefault: { type: boolean }
        hiddenAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    FinanceCategoriesResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FinanceCategory" }
    FinanceTagCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
    FinanceTag:
      type: object
      required: [id, tenantId, name, createdAt, updatedAt]
      properties:
        id: { type: string }
        tenantId: { type: string }
        name: { type: string }
        hiddenAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    FinanceTagsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FinanceTag" }
    FinanceTransactionCreateRequest:
      type: object
      required: [accountId, source, status, kind, amountMinor, currency, description, effectiveAt]
      properties:
        accountId: { type: string }
        source: { type: string }
        status: { type: string }
        kind: { type: string }
        amountMinor: { type: integer, format: int64 }
        currency: { type: string }
        description: { type: string }
        effectiveAt: { type: string, format: date-time }
        categoryId: { type: string }
        tagIds:
          type: array
          items: { type: string }
        transferGroupId: { type: string }
    FinanceTransaction:
      type: object
      required: [id, tenantId, accountId, source, status, kind, amountMinor, currency, description, effectiveAt, tagIds, createdAt, updatedAt]
      properties:
        id: { type: string }
        tenantId: { type: string }
        accountId: { type: string }
        source: { type: string }
        status: { type: string }
        kind: { type: string }
        amountMinor: { type: integer, format: int64 }
        currency: { type: string }
        description: { type: string }
        effectiveAt: { type: string, format: date-time }
        categoryId: { type: string, nullable: true }
        tagIds:
          type: array
