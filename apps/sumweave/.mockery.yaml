dir: '{{.InterfaceDirRelative}}'
template: testify
template-data:
  mock-build-tags: '!release'
  unroll-variadic: true

packages:
  net/http:
    interfaces:
      RoundTripper:
        config:
          dir: internal/infrastructure/httpclient/
          pkgname: httpclient
  log/slog:
    interfaces:
      Handler:
        config:
          dir: internal/telemetry/
          pkgname: telemetry
          filename: mock_slog_handler_test.go
          structname: MockSlogHandler
  github.com/gemyago/sumweave/apps/sumweave/internal/auth:
    interfaces:
      userStore:
      jwtService:
      refreshTokenStore:
      passwordHasher:
  github.com/gemyago/sumweave/apps/sumweave/internal/api/http/middleware:
    interfaces:
      jwtValidator:
  github.com/gemyago/sumweave/apps/sumweave/internal/api/http/v1controllers:
    interfaces:
      AuthenticatingService:
      bankConnectionService:
      financeService:
      providerSnapshotService:
      transferDetailService:
      jobsService:
      userDirectory:
  github.com/gemyago/sumweave/apps/sumweave/internal/app:
    interfaces:
      AuthUserLookup:
  github.com/gemyago/sumweave/apps/sumweave/internal/jobs:
    interfaces:
      workerStore:
      workerRouter:
      workerRouterFactory:
      jobReader:
      schemaMigrator:
        config:
          filename: mock_schema_migrator_test.go
  github.com/gemyago/sumweave/apps/sumweave/internal/appdispatch:
    interfaces:
      migrationRunner:
        config:
          filename: mock_migration_runner_test.go
      messagePublisher:
        config:
          filename: mock_message_publisher_test.go
  github.com/gemyago/sumweave/apps/sumweave/internal/appevents:
    interfaces:
      messagePublisher:
        config:
          filename: mocks_test.go
      handlerRegistrar:
        config:
          filename: mock_handler_registrar_test.go
  github.com/gemyago/sumweave/apps/sumweave/internal:
    interfaces:
      AgentRuntimeMigrator:
      databaseRuntimeServiceFactory:
      componentMigrator:
      autoMigrator:
  github.com/gemyago/sumweave/apps/sumweave/internal/wireup:
    interfaces:
      migrationRunner:
      migrationConfigLoader:
      agentRuntimeSchemaMigrator:
      agentRuntimeMigrationPreparer:
      scheduleEnqueuer:
  github.com/gemyago/sumweave/apps/sumweave/internal/financeapp:
    interfaces:
      fxRefreshJobService:
      csvImportJobService:
      bankSyncJobService:
      appdispatchPublisher:
  github.com/ThreeDotsLabs/watermill/message:
    interfaces:
      Subscriber:
        config:
          dir: internal/appdispatch/
          pkgname: appdispatch
  github.com/gemyago/sumweave/apps/sumweave/cmd/sumweave:
    interfaces:
      databaseMigrationRunner:
      jobsWorkerRunner:
      jobsWorkerCommandRunner:
      jobsSchedulerRunner:
      jobsSchedulerCommandRunner:
      startAllHTTPServer:
      startAllRunner:
      startServerRunner:
      userCommandStore:
      financeFixturesTenantService:
      financeFixturesCatalogService:
      financeFixturesLedgerService:
      financeFixturesCSVImportService:
      financeFixturesBankConnectionService:
      financeFixturesBankSyncService:
      financeFixturesFXService:
