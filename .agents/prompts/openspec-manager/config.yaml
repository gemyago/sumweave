# Example manager config for openspec manager sub-agents.
# Copy, trim, or override per sub-agent as needed.
# model: short label for manager spawn messages
# opencode_model: fully-qualified OpenCode model (provider/model) for generated agents
# Each role must have a matching instruction file:
#   .agents/prompts/openspec-manager/agent-<role>.md
sub-agents:
  planning:
    sub_agent_name: openspec-planning
    model: gpt-5.4
    opencode_model: openai/gpt-5.4
    reasoning_effort: high
  plan-reviewing:
    sub_agent_name: openspec-plan-reviewing
    model: gpt-5.4
    opencode_model: openai/gpt-5.4
    reasoning_effort: high
  implementation:
    sub_agent_name: openspec-implementation
    model: gpt-5.4
    opencode_model: openai/gpt-5.4
    reasoning_effort: medium
  chunk-finalizing:
    sub_agent_name: openspec-chunk-finalizing
    model: gpt-5.3-codex-spark
    opencode_model: openai/gpt-5.3-codex-spark
    reasoning_effort: high
  implementation-finalizing:
    sub_agent_name: openspec-implementation-finalizing
    model: gpt-5.4
    opencode_model: openai/gpt-5.4
    reasoning_effort: high
